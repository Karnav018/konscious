name: Release

# A tag is the whole release. Pushing v0.2.0 builds every app (macOS, Windows,
# Linux), signs them for the updater and publishes one GitHub release — which is where every installed
# copy of Konscious looks for its next version (app/src/lib/update.ts).
#
#   scripts/release.sh 0.2.0     bumps every version, commits, tags, pushes
#
# Secrets this needs (Settings › Secrets and variables › Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the private half of the updater keypair
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  only if that key has a password; left
#                                       unset it passes "", which is what a
#                                       key generated without one wants (and
#                                       passing it explicitly is what keeps
#                                       the signer from prompting and hanging)
# Without the key the build fails rather than publishing updates nobody can install.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.2.0)
        required: true
      ref:
        description: >-
          Optional. What to build, if not the tag itself (e.g. main) — for
          adding a platform to a published release without moving its tag.
          The app's version there must still be the tag's.
        required: false
        default: ''
      mac_from_run:
        description: >-
          Optional. Run ID of an earlier run of this workflow, for the same
          version, whose macOS build to reuse instead of building it again —
          for when only the Windows or Linux build needs redoing.
        required: false
        default: ''
      windows_from_run:
        description: >-
          Optional. The same for the Windows build.
        required: false
        default: ''

permissions:
  contents: write
  actions: read # fetch builds from an earlier run (mac_from_run, windows_from_run)

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  macos:
    name: macOS (universal)
    # Skipped when a previous run's macOS build is reused (mac_from_run).
    if: ${{ !inputs.mac_from_run }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: pnpm install --frozen-lockfile

      # The tag and the version in the app must agree, or the updater would
      # offer a version the manifest does not name.
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag=${{ inputs.tag || github.ref_name }}
          [ "v$version" = "$tag" ] || { echo "✗ tag $tag but version $version — run scripts/release.sh"; exit 1; }
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Checks (tests, types, engine, clippy)
        run: scripts/check-mac.sh

      - name: Build universal app + DMG
        run: CI=true pnpm -s tauri build --target universal-apple-darwin --bundles app,dmg

      # Named the way the website and the manifest expect; see
      # scripts/updater-manifest.mjs.
      - name: Collect
        run: |
          out="$GITHUB_WORKSPACE/assets"
          mkdir -p "$out"
          b=src-tauri/target/universal-apple-darwin/release/bundle
          cp "$(ls -t "$b"/dmg/*.dmg | head -1)" "$out/Konscious-${version}-universal.dmg"
          cp "$b/macos/Konscious.app.tar.gz" "$out/Konscious_${version}_universal.app.tar.gz"
          cp "$b/macos/Konscious.app.tar.gz.sig" "$out/Konscious_${version}_universal.app.tar.gz.sig"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: assets/
          if-no-files-found: error

  windows:
    name: Windows (x64)
    # Skipped when a previous run's Windows build is reused (windows_from_run).
    if: ${{ !inputs.windows_from_run }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag=${{ inputs.tag || github.ref_name }}
          [ "v$version" = "$tag" ] || { echo "✗ tag $tag but version $version — run scripts/release.sh"; exit 1; }
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Checks (tests, types, engine, clippy)
        run: scripts/check-windows.sh

      - name: Build NSIS installer
        run: pnpm -s tauri build --bundles nsis

      - name: Collect
        run: |
          out="$GITHUB_WORKSPACE/assets"
          mkdir -p "$out"
          exe=$(ls -t src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" "$out/Konscious_${version}_x64-setup.exe"
          cp "$exe.sig" "$out/Konscious_${version}_x64-setup.exe.sig"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: assets/
          if-no-files-found: error

  linux:
    name: Linux (x64)
    # The AppImage runs on distros with this glibc or newer (Ubuntu 22.04,
    # Debian 12, Fedora 36, Arch). GitHub retires 22.04 runners in April 2027:
    # move to ubuntu-24.04 then (glibc 2.39: Ubuntu 24.04, Debian 13, Fedora 40).
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      # What Tauri builds against on Linux (WebKitGTK, GTK); the .deb lists
      # these as its dependencies, the AppImage carries them.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag=${{ inputs.tag || github.ref_name }}
          [ "v$version" = "$tag" ] || { echo "✗ tag $tag but version $version — run scripts/release.sh"; exit 1; }
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Checks (tests, types, engine, clippy)
        run: scripts/check-linux.sh

      # linuxdeploy (run by the AppImage bundler) is an AppImage itself:
      # unpack it rather than rely on FUSE being there.
      - name: Build AppImage + .deb
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm -s tauri build --bundles appimage,deb

      - name: Collect
        run: |
          out="$GITHUB_WORKSPACE/assets"
          mkdir -p "$out"
          b=src-tauri/target/release/bundle
          appimage=$(ls -t "$b"/appimage/*.AppImage | head -1)
          deb=$(ls -t "$b"/deb/*.deb | head -1)
          cp "$appimage" "$out/Konscious_${version}_amd64.AppImage"
          cp "$appimage.sig" "$out/Konscious_${version}_amd64.AppImage.sig"
          cp "$deb" "$out/Konscious_${version}_amd64.deb"
          cp "$deb.sig" "$out/Konscious_${version}_amd64.deb.sig"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: assets/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [macos, windows, linux]
    # Every platform built by this run, or reused from an earlier run of the
    # same version (mac_from_run, windows_from_run).
    if: >-
      ${{ !cancelled() && needs.linux.result == 'success' &&
      (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && inputs.mac_from_run != '')) &&
      (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && inputs.windows_from_run != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Fetch the macOS build from run ${{ inputs.mac_from_run }}
        if: ${{ inputs.mac_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: assets
          run-id: ${{ inputs.mac_from_run }}
          github-token: ${{ github.token }}
      - name: Fetch the Windows build from run ${{ inputs.windows_from_run }}
        if: ${{ inputs.windows_from_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets
          run-id: ${{ inputs.windows_from_run }}
          github-token: ${{ github.token }}

      # Every file must be this version, so a reused build from another
      # release can never be published under this tag.
      - name: Check the builds are complete and this version
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          ls -lh assets
          for f in "Konscious-${version}-universal.dmg" \
                   "Konscious_${version}_universal.app.tar.gz" "Konscious_${version}_universal.app.tar.gz.sig" \
                   "Konscious_${version}_x64-setup.exe" "Konscious_${version}_x64-setup.exe.sig" \
                   "Konscious_${version}_amd64.AppImage" "Konscious_${version}_amd64.AppImage.sig" \
                   "Konscious_${version}_amd64.deb" "Konscious_${version}_amd64.deb.sig"; do
            [ -f "assets/$f" ] || { echo "✗ missing assets/$f"; exit 1; }
          done

      # One manifest for every platform, written only once every build is in:
      # a release with a half-filled latest.json would silently stop updates
      # for the missing platform.
      - name: Write latest.json
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          node scripts/updater-manifest.mjs assets "$version" > assets/latest.json
          cat assets/latest.json

      # Not a draft and not a prerelease: the apps poll
      # releases/latest/download/latest.json, which only ever serves a
      # published, non-prerelease release. Re-running the workflow on a tag
      # replaces the assets instead of failing on the existing release.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ inputs.tag || github.ref_name }}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" \
              --title "Konscious ${tag#v}" \
              --generate-notes \
              --latest \
              assets/*
          fi
