[package]
name = "konscious"
version = "0.2.4"
description = "Konscious — every Claude session, one calm place"
authors = ["karnav"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "konscious_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable is "Konscious": macOS labels an unbundled process (tauri dev) in
# the Dock by its binary name.
[[bin]]
name = "Konscious"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Pinned to the npm @tauri-apps/plugin-opener minor (tauri build refuses a mismatch).
tauri-plugin-opener = "~2.6"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# Pinned to the npm @tauri-apps/plugin-updater minor, like opener above.
tauri-plugin-updater = "~2.13"
# relaunch() once an update has been installed.
tauri-plugin-process = "~2.4"
# Per-session memory for the Inspector: resident size of a session's process tree.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Inlining a dropped image as a data URL for the pane's attachment strip.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"
# NSPasteboard: what ⌘V pastes into a pane (copied files → their paths).
# Same versions Tauri already builds, so nothing extra is compiled.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# unwind (not abort): a panic in one session's thread must not take down the
# app and every other session with it.
# No strip: on this macOS, stripped Mach-O files fail to load ("mis-aligned
# LINKEDIT string pool") — it broke every proc-macro dylib in release builds.
strip = false
